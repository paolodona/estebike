<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Scarica traccia — Percorso Corto</title>
    <link rel="stylesheet" href="print.css" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <img src="qr/estebike-logo.png" alt="EsteBike" class="logo" />
        <span class="eyebrow">Magna &amp; Pedala 2026</span>
      </header>

      <section class="title-block">
        <h1 class="title">Scarica la traccia</h1>
        <p class="route">Percorso Corto</p>
      </section>

      <div class="qr-wrap">
        <img src="qr/qr-corto.png" alt="QR Code Percorso Corto" class="qr" />
      </div>

      <footer class="bottom">
        <p class="cta">Inquadra il QR con il tuo telefono</p>
        <p class="url">estebike.it/magna-e-pedala/2026/corto</p>
        <p class="hint">
          Scarica la traccia GPX, oppure aprila su Strava, Komoot o Google Maps.
        </p>
      </footer>
    </div>
  </body>
</html>
